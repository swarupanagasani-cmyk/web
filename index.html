<!DOCTYPE html>
<html>
<head>
    <title>Company Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
                 background:linear-gradient(135deg,red ,green);
                 color:#333;
                 min-height:100vh;
           }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
           background-color:pink;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .logo-section img {
            width: 50px;
            height: 50px;
            margin-right: 10px;
        }

        .company-name {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            text-decoration: none;
            margin-left: 20px;
            color: black;
            font-size: 20px;
        }

        .nav-links a:hover {
            color: orange;
        }
        .nav-links a ul{
            display:none;
            position:absolute;
            background-color:whitesmoke ;
            padding: 10px;
            border-radius: 5px;
        }
        #img{
            z-index:0;

        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
              <div class="logo-section">
                <img src="logo.jpeg" alt="logo">
                <div class="company-name">MY WEBSITE</div>
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Login</a>
                <a href="#">Contact Us</a>
                <a href="#">courses</a>
            </div>

        </div>
    </div>
    <img src="slide3.jpeg" height="100%" width="100%">

</body>
</html>
